<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d5e"/>
      <stop offset="1" stop-color="#ff9e57"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="240" rx="14" fill="url(#bg)"/>
  <rect width="900" height="240" rx="14" fill="url(#grid)" opacity="0.55"/>

  <!-- window bar -->
  <rect x="0.5" y="0.5" width="899" height="239" rx="14" fill="none" stroke="#30363d"/>
  <path d="M14 0.5H886A13.5 13.5 0 0 1 899.5 14V36H0.5V14A13.5 13.5 0 0 1 14 0.5Z" fill="#161b22"/>
  <line x1="0.5" y1="36" x2="899.5" y2="36" stroke="#30363d"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">bicky@victus: ~</text>

  <!-- prompt -->
  <text x="36" y="76" class="mono" font-size="16" fill="#8b949e"><tspan fill="#3fb950">bicky@victus</tspan>:<tspan fill="#58a6ff">~</tspan>$ whoami</text>

  <text x="36" y="128" class="mono" font-size="40" font-weight="700" fill="url(#accent)">Bicky</text>
  <text x="168" y="128" class="mono" font-size="20" fill="#c9d1d9">// CSE student &amp; builder</text>

  <text x="36" y="168" class="mono" font-size="15" fill="#c9d1d9">
    <tspan fill="#ff7b72">&gt;</tspan> safe AI agents  <tspan fill="#484f58">·</tspan>  Linux from scratch  <tspan fill="#484f58">·</tspan>  security  <tspan fill="#484f58">·</tspan>  backend systems
  </text>

  <text x="36" y="208" class="mono" font-size="16" fill="#8b949e"><tspan fill="#3fb950">bicky@victus</tspan>:<tspan fill="#58a6ff">~</tspan>$ <tspan fill="#c9d1d9">./build --safely</tspan><tspan class="cursor" fill="#ff9e57">█</tspan></text>

  <!-- small agent-loop glyph on the right -->
  <g transform="translate(812 136)" fill="none" stroke-width="2">
    <circle r="40" stroke="#30363d"/>
    <path d="M0 -40 A40 40 0 0 1 40 0" stroke="#ff4d5e"/>
    <path d="M40 0 A40 40 0 0 1 0 40" stroke="#ff9e57"/>
    <path d="M0 40 A40 40 0 0 1 -40 0" stroke="#3fb950"/>
    <path d="M-40 0 A40 40 0 0 1 0 -40" stroke="#58a6ff"/>
    <text x="0" y="-46" text-anchor="middle" class="mono" font-size="10" fill="#8b949e" stroke="none">plan</text>
    <text x="46" y="4" class="mono" font-size="10" fill="#8b949e" stroke="none">act</text>
    <text x="0" y="56" text-anchor="middle" class="mono" font-size="10" fill="#8b949e" stroke="none">verify</text>
    <text x="-46" y="4" text-anchor="end" class="mono" font-size="10" fill="#8b949e" stroke="none">fix</text>
    <circle r="5" fill="#ff4d5e" stroke="none"/>
  </g>
</svg>
